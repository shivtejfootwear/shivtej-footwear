<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shivtej Footwear | Smart Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}header{background:#101828;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}nav{background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;gap:8px;overflow:auto}button,select,input{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.navbtn{background:#eef2f7}.navbtn.active,.primary{background:#101828;color:#fff}main{max-width:1250px;margin:auto;padding:18px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}input,select{width:100%;padding:11px;border:1px solid #ccd3dd;border-radius:8px;background:#fff}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid #e0e5eb;border-radius:12px;padding:14px;box-shadow:0 2px 8px #0000000a}.card h3{margin:0 0 7px}.muted{color:#667085;font-size:13px}.price{font-weight:700;font-size:19px;margin:10px 0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:12px;background:#dcfce7;color:#166534}.out{background:#fee2e2;color:#991b1b}.sizes{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.size{padding:5px 8px;border:1px solid #d0d5dd;border-radius:6px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.hidden{display:none}@media(max-width:800px){.toolbar,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.toolbar,.grid,.products{grid-template-columns:1fr}}</style></head><body><header><h1>Shivtej Footwear</h1><p>Smart Footwear Store • Online + Offline Stock Management</p></header><nav><button class="navbtn active" onclick="tab('catalog',this)">Catalog</button><button class="navbtn" onclick="tab('stock',this)">Stock</button><button class="navbtn" onclick="tab('admin',this)">Add / Manage</button></nav><main><section id="catalog"><div class="toolbar"><input id="search" placeholder="Search article, colour, brand..." oninput="render()"><select id="category" onchange="render()"><option value="">All categories</option></select><select id="size" onchange="render()"><option value="">All sizes</option></select><select id="stock" onchange="render()"><option value="">All stock</option><option value="available">Available</option><option value="out">Out of stock</option></select></div><div id="products" class="products"></div></section><section id="stockTab" class="hidden panel"><h2>Stock Overview</h2><p class="muted">Online and offline stock are tracked separately.</p><div id="stockTable"></div></section><section id="admin" class="hidden"><div class="panel"><h2>Add Product</h2><div class="grid"><input id="article" placeholder="Article"><input id="brand" placeholder="Brand"><input id="colour" placeholder="Colour"><input id="mrp" placeholder="MRP"><input id="cat" placeholder="Category"><input id="sizes" placeholder="Sizes e.g. 8,9,10"><input id="online" placeholder="Online qty"><input id="offline" placeholder="Offline qty"></div><br><button class="primary" onclick="add()">Add Product</button></div><div class="panel"><h3>Configured size groups</h3><p class="muted">Kids shoes: 8–10, 11–13, 1–3, 4–6 • Adult: 7–10, 11–12 • Kids Crocs: 15–19, 20–25, 25–29 • Ladies Fancy: 36–41</p></div></section></main><script>const demo=[['ST-001','STIMULUS','Black',499,'Kids Shoes',['8','9','10'],5,3],['ST-002','STIMULUS','Navy',599,'Kids Shoes',['11','12','13','1','2','3'],7,4],['ST-003','STIMULUS','Brown',699,'Men',['4','5','6'],0,5],['ST-004','STIMULUS','Black',799,'Men',['7','8','9','10'],4,2],['ST-005','STIMULUS','Black',899,'Men',['11','12'],2,1],['CR-001','CROCS','Blue',499,'Kids Crocs',['15','16','17','18','19'],3,2],['CR-002','CROCS','Pink',599,'Kids Crocs',['20','21','22','23','24','25'],6,1],['CR-003','CROCS','Black',699,'Kids Crocs',['25','26','27','28','29'],0,4],['LF-001','STIMULUS','Gold',999,'Ladies Fancy',['36','37','38','39','40','41'],5,3]];let p=JSON.parse(localStorage.getItem('shivtej_products')||'null')||demo.map(x=>({article:x[0],brand:x[1],colour:x[2],mrp:x[3],category:x[4],sizes:x[5],online:x[6],offline:x[7]}));const $=id=>document.getElementById(id);function save(){localStorage.setItem('shivtej_products',JSON.stringify(p))}function setup(){let cs=[...new Set(p.map(x=>x.category))],ss=[...new Set(p.flatMap(x=>x.sizes))];$('category').innerHTML='<option value="">All categories</option>'+cs.map(x=>`<option>${x}</option>`).join('');$('size').innerHTML='<option value="">All sizes</option>'+ss.map(x=>`<option>${x}</option>`).join('');render();stockRender()}function render(){let q=$('search').value.toLowerCase(),c=$('category').value,s=$('size').value,f=$('stock').value;a=p.filter(x=>(!q||[x.article,x.brand,x.colour,x.category].join(' ').toLowerCase().includes(q))&&(!c||x.category==c)&&(!s||x.sizes.includes(s))&&(!f||(f=='available'?x.online>0:x.online<=0)));$('products').innerHTML=a.map(x=>`<div class="card"><h3>${x.brand} • ${x.article}</h3><div class="muted">${x.category} • ${x.colour}</div><div class="price">₹${x.mrp}</div><span class="badge ${x.online?'':'out'}">${x.online?'ONLINE AVAILABLE':'OUT OF STOCK'}</span><div class="sizes">${x.sizes.map(s=>`<span class="size">Size ${s}</span>`).join('')}</div><div class="muted">Online: ${x.online} • Offline: ${x.offline}</div></div>`).join('')||'<div class="panel">No matching products.</div>'}function stockRender(){$('stockTable').innerHTML='<table><tr><th>Article</th><th>Category</th><th>Sizes</th><th>Online</th><th>Offline</th><th>Status</th></tr>'+p.map(x=>`<tr><td>${x.article}</td><td>${x.category}</td><td>${x.sizes.join(', ')}</td><td>${x.online}</td><td>${x.offline}</td><td>${x.online?'Available':'Out of stock'}</td></tr>`).join('')+'</table>'}function add(){p.push({article:$('article').value||'NEW',brand:$('brand').value||'STIMULUS',colour:$('colour').value||'Black',mrp:+$('mrp').value||0,category:$('cat').value||'Other',sizes:$('sizes').value.split(',').map(x=>x.trim()).filter(Boolean),online:+$('online').value||0,offline:+$('offline').value||0});save();setup();alert('Product added')}function tab(id,b){['catalog','admin'].forEach(x=>$(x).classList.toggle('hidden',x!=id));$('stockTab').classList.toggle('hidden',id!='stock');document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id=='stock')stockRender()}setup();</script></body></html>

name: Build product pages

# Runs once a day (06:00 IST) and on demand (Actions tab -> Run workflow). Saves GitHub Actions minutes.
# New or changed products in the owner app appear on the website's product pages after the next run.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build product pages and sitemap
        run: node scripts/build-product-pages.mjs

      - name: Commit and push if anything changed
        run: |
          git config user.name "shivtej-product-pages"
          git config user.email "actions@users.noreply.github.com"
          git add -A p sitemap.xml
          if git diff --cached --quiet; then
            echo "No product changes."
            exit 0
          fi
          git commit -m "Update product pages from website database" \
            -m "Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PMizHKXLMgSbHxuNV6WJAQ"
          git push
